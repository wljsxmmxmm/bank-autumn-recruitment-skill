<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#ffffff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#1f2937">银行秋招竞争力评估</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">从简历证据出发，输出评分、短板和下一步补强动作</text>
  <g transform="translate(72 160)">
    <rect width="250" height="250" rx="14" fill="#f2f6ff" stroke="#c9d8ff"/>
    <text x="24" y="42" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">综合判断</text>
    <text x="24" y="86" font-family="Arial" font-size="54" font-weight="700" fill="#1d4ed8">76</text>
    <text x="116" y="86" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#475467">/100</text>
    <text x="24" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#344054">中上竞争力</text>
    <text x="24" y="156" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#475467">主攻城商行/股份行</text>
    <text x="24" y="184" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#475467">冲刺六大行金融市场</text>
    <text x="24" y="212" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#475467">补强笔试和宏观表达</text>
  </g>
  <g transform="translate(360 160)" font-family="Arial, 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#111827">六维评分</text>
    <g transform="translate(0 26)" font-size="15" fill="#344054">
      <text y="22">学历背景</text><rect x="120" y="7" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="7" width="212" height="12" rx="6" fill="#2563eb"/>
      <text y="62">银行实习</text><rect x="120" y="47" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="47" width="190" height="12" rx="6" fill="#2563eb"/>
      <text y="102">专业能力</text><rect x="120" y="87" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="87" width="205" height="12" rx="6" fill="#2563eb"/>
      <text y="142">证书材料</text><rect x="120" y="127" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="127" width="170" height="12" rx="6" fill="#2563eb"/>
      <text y="182">项目经历</text><rect x="120" y="167" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="167" width="158" height="12" rx="6" fill="#2563eb"/>
      <text y="222">校园经历</text><rect x="120" y="207" width="250" height="12" rx="6" fill="#e5e7eb"/><rect x="120" y="207" width="150" height="12" rx="6" fill="#2563eb"/>
    </g>
  </g>
  <g transform="translate(72 438)" font-family="Arial, 'PingFang SC', sans-serif">
    <rect width="816" height="38" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="18" y="25" font-size="15" fill="#9a3412">输出：相关经历证据链、短板诊断、银行类型匹配、2-4 周补强计划</text>
  </g>
</svg>
