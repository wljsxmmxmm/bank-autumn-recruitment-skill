<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f6f7f9"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#fff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">周复盘与下周策略</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">把一周投递、流程、结果和卡点沉淀成下周行动</text>
  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="15">
    <rect x="72" y="160" width="816" height="44" fill="#eef2ff"/>
    <text x="96" y="188" font-weight="700" fill="#3730a3">指标</text><text x="330" y="188" font-weight="700" fill="#3730a3">本周数量</text><text x="510" y="188" font-weight="700" fill="#3730a3">判断</text>
    <g fill="#344054">
      <rect x="72" y="204" width="816" height="42" fill="#fff" stroke="#edf0f5"/><text x="96" y="231">新增岗位</text><text x="350" y="231">6</text><text x="510" y="231">官方公告核验仍不足</text>
      <rect x="72" y="246" width="816" height="42" fill="#fbfdff" stroke="#edf0f5"/><text x="96" y="273">已投递</text><text x="350" y="273">3</text><text x="510" y="273">P0 推进偏慢</text>
      <rect x="72" y="288" width="816" height="42" fill="#fff" stroke="#edf0f5"/><text x="96" y="315">笔试/面试中</text><text x="350" y="315">5</text><text x="510" y="315">需要开始专项准备</text>
      <rect x="72" y="330" width="816" height="42" fill="#fbfdff" stroke="#edf0f5"/><text x="96" y="357">offer/拒绝/放弃</text><text x="350" y="357">3</text><text x="510" y="357">需要复盘岗位取舍</text>
    </g>
    <rect x="72" y="410" width="816" height="58" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="96" y="443" font-weight="700" fill="#15803d">下周动作</text>
    <text x="190" y="443" fill="#344054">优先处理 P0/P1 临近截止岗位；流程中岗位做笔面试专项准备。</text>
  </g>
</svg>
