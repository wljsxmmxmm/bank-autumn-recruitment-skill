    <text x="662" y="286" fill="#344054">违约金/三方</text>
    <text x="662" y="314" fill="#344054">几年后换路空间</text>
    <rect x="72" y="420" width="816" height="48" rx="12" fill="#111827"/>
    <text x="96" y="450" font-weight="700" fill="#fff">输出：Offer 对比表 + 必问清单 + 风险排序 + 建议选择</text>
