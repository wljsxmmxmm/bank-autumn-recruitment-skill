  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="15">
    <rect x="72" y="160" width="250" height="220" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="96" y="196" font-weight="700" fill="#1d4ed8">稳定性</text>
    <text x="96" y="230" fill="#344054">合同主体</text>
    <text x="96" y="258" fill="#344054">轮岗周期</text>
    <text x="96" y="286" fill="#344054">城市定岗</text>
    <text x="96" y="314" fill="#344054">户口/编制边界</text>
    <rect x="355" y="160" width="250" height="220" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="379" y="196" font-weight="700" fill="#15803d">成长性</text>
    <text x="379" y="230" fill="#344054">岗位真实内容</text>
    <text x="379" y="258" fill="#344054">业务/产品/风控能力</text>
