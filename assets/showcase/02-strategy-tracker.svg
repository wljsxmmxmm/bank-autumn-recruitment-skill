<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#fff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">银行池与投递表预览</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">按优先级、银行类型、岗位方向生成可执行投递清单</text>
  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="15">
    <rect x="72" y="158" width="816" height="44" fill="#eef2ff"/>
    <text x="92" y="186" font-weight="700" fill="#3730a3">银行名称</text>
    <text x="270" y="186" font-weight="700" fill="#3730a3">方向</text>
    <text x="430" y="186" font-weight="700" fill="#3730a3">优先级</text>
    <text x="560" y="186" font-weight="700" fill="#3730a3">状态</text>
    <text x="690" y="186" font-weight="700" fill="#3730a3">下一动作</text>
    <g fill="#344054">
      <rect x="72" y="202" width="816" height="46" fill="#ffffff" stroke="#edf0f5"/><text x="92" y="231">上海银行</text><text x="270" y="231">管培/公司金融</text><text x="430" y="231">P0主攻</text><text x="560" y="231">未投</text><text x="690" y="231">完成网申</text>
      <rect x="72" y="248" width="816" height="46" fill="#fbfdff" stroke="#edf0f5"/><text x="92" y="277">建设银行上海分行</text><text x="270" y="277">公司金融</text><text x="430" y="277">P0主攻</text><text x="560" y="277">待确认</text><text x="690" y="277">核验轮岗</text>
      <rect x="72" y="294" width="816" height="46" fill="#ffffff" stroke="#edf0f5"/><text x="92" y="323">招商银行</text><text x="270" y="323">公司金融</text><text x="430" y="323">P1重点</text><text x="560" y="323">已投</text><text x="690" y="323">查测评通知</text>
      <rect x="72" y="340" width="816" height="46" fill="#fbfdff" stroke="#edf0f5"/><text x="92" y="369">交通银行</text><text x="270" y="369">金融市场</text><text x="430" y="369">P1重点</text><text x="560" y="369">笔试</text><text x="690" y="369">准备宏观观点</text>
      <rect x="72" y="386" width="816" height="46" fill="#ffffff" stroke="#edf0f5"/><text x="92" y="415">南京银行</text><text x="270" y="415">总分行管培</text><text x="430" y="415">P0主攻</text><text x="560" y="415">offer</text><text x="690" y="415">Offer 决策</text>
    </g>
  </g>
  <text x="72" y="470" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#475467">脚本负责字段和排序，避免手写表格导致字段漂移。</text>
</svg>
