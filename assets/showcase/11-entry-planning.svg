<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#ffffff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">从一句话开始规划</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">背景不足时先给轻量入口，不急着生成大表或做过度判断</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="72" y="164" width="816" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="98" y="202" font-size="17" fill="#334155">用户：我是 2027 届，想投银行秋招，先带我做规划。</text>
    <rect x="72" y="256" width="380" height="58" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="98" y="292" font-size="16" font-weight="700" fill="#3730a3">A. 先做简历竞争力评估</text>
    <rect x="508" y="256" width="380" height="58" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="534" y="292" font-size="16" font-weight="700" fill="#1d4ed8">B. 先做银行池和投递优先级</text>
    <rect x="72" y="342" width="380" height="58" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="98" y="378" font-size="16" font-weight="700" fill="#166534">C. 先把已有岗位整理成表</text>
    <rect x="508" y="342" width="380" height="58" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="534" y="378" font-size="16" font-weight="700" fill="#c2410c">D. 先维护已有 Notion 表</text>
    <rect x="72" y="436" width="816" height="38" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="94" y="461" font-size="15" fill="#52525b">下一步：补齐学校、专业、实习、证书、城市、岗位偏好和底线约束。</text>
  </g>
</svg>
