<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#ffffff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">笔试面试准备计划</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">根据当前投递状态，安排最该准备的题型、银行和表达材料</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="72" y="160" width="384" height="246" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="98" y="198" font-size="20" font-weight="700" fill="#1d4ed8">交通银行金融市场方向笔试</text>
    <text x="98" y="236" font-size="16" fill="#334155">EPI/行测：资料分析、数量关系、逻辑推理</text>
    <text x="98" y="270" font-size="16" fill="#334155">英语：阅读理解、金融场景词汇</text>
    <text x="98" y="304" font-size="16" fill="#334155">金融市场：利率、债券、汇率、央行工具</text>
    <text x="98" y="338" font-size="16" fill="#334155">开放题：利率下行与银行资产配置压力</text>
    <rect x="98" y="364" width="124" height="28" rx="8" fill="#dbeafe"/>
    <text x="118" y="383" font-size="14" fill="#1d4ed8">优先级：高</text>
    <rect x="504" y="160" width="384" height="246" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="530" y="198" font-size="20" font-weight="700" fill="#166534">宁波银行杭州分行一面</text>
    <text x="530" y="236" font-size="16" fill="#334155">为什么选择杭州？</text>
    <text x="530" y="270" font-size="16" fill="#334155">为什么选择城商行，而不是券商？</text>
    <text x="530" y="304" font-size="16" fill="#334155">公司金融实习里最有代表性的业务理解</text>
    <text x="530" y="338" font-size="16" fill="#334155">如何理解基层轮岗和长期路径？</text>
    <rect x="530" y="364" width="124" height="28" rx="8" fill="#dcfce7"/>
    <text x="550" y="383" font-size="14" fill="#166534">优先级：高</text>
    <rect x="72" y="436" width="816" height="38" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="94" y="461" font-size="15" fill="#9a3412">输出：本周准备顺序、题型重点、简历追问题、面试表达框架。</text>
  </g>
</svg>
