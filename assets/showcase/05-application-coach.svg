<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <rect x="40" y="36" width="880" height="468" rx="18" fill="#fff" stroke="#d9dee8"/>
  <text x="72" y="88" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">公告后网申陪跑</text>
  <text x="72" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#667085">先判断值不值得投，再决定岗位、简历版本和网申表达</text>
  <g transform="translate(72 160)" font-family="Arial, 'PingFang SC', sans-serif">
    <rect width="816" height="74" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="32" font-size="18" font-weight="700" fill="#1d4ed8">招商银行上海分行｜公司金融方向</text>
    <text x="24" y="58" font-size="15" fill="#344054">判断：P1 重点；能接受客户经理和 KPI 属性时投递</text>
    <g transform="translate(0 106)" font-size="15" fill="#344054">
      <rect width="250" height="150" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="22" y="34" font-weight="700">岗位选择</text>
      <text x="22" y="66">优先公司金融/管培</text>
      <text x="22" y="94">谨慎纯营销岗位</text>
      <text x="22" y="122">核验轮岗比例</text>
      <rect x="283" width="250" height="150" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="305" y="34" font-weight="700">简历版本</text>
      <text x="305" y="66">银行业务版</text>
      <text x="305" y="94">突出公司金融实习</text>
      <text x="305" y="122">减少纯技术表达</text>
      <rect x="566" width="250" height="150" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="588" y="34" font-weight="700">网申细节</text>
      <text x="588" y="66">开放题写长期城市意愿</text>
      <text x="588" y="94">志愿顺序先匹配岗位</text>
      <text x="588" y="122">记录账号和投递日期</text>
    </g>
  </g>
</svg>
